<style>
/* Layout: full-bleed canvas scene (marquee type, halftone, product hero); one small control bottom-right */
:root{
  --ink:#070707;
  --red:#d9161c;
  --hot:#ff3b30;
  --white:#f6f3f2;
  --display:"Anton","Impact","Arial Narrow",sans-serif;
  --label:"Barlow Condensed","Arial Narrow",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--white);overflow:hidden;font-family:var(--label)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.bar{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:5}
.bar button{font:italic 600 14px/1 var(--label);letter-spacing:.08em;text-transform:uppercase;color:var(--white);
  background:rgba(7,7,7,.55);border:1px solid rgba(246,243,242,.3);border-radius:999px;padding:9px 14px;cursor:pointer;backdrop-filter:blur(6px)}
.bar button:hover{border-color:var(--hot)}
.bar button:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
</style>

const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const LOOP=6, TAU=Math.PI*2;
let W,H,dpr,running=true,t0=performance.now(),paused=0;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const img=new Image();img.src=POUCH;

function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
addEventListener('resize',()=>{resize();if(!running)draw(paused);});resize();

const rnd=(s=>()=>(s=(s*16807)%2147483647)/2147483647)(7);
const streaks=Array.from({length:22},()=>({y:rnd(),off:rnd(),len:.12+rnd()*.3,w:1+rnd()*2.5,speed:1+Math.floor(rnd()*2),a:.2+rnd()*.5}));
const sparks=Array.from({length:60},()=>({x:rnd(),off:rnd(),r:.6+rnd()*2,speed:1+Math.floor(rnd()*2),sway:rnd()*TAU}));

let _sc;function sheenCanvas(pw,ph){const w=Math.round(pw*dpr),h=Math.round(ph*dpr);if(!_sc)_sc=document.createElement('canvas');if(_sc.width!==w||_sc.height!==h){_sc.width=w;_sc.height=h;}return _sc;}
function fitFont(text,font,size,max){ctx.font=font(size);const w=ctx.measureText(text).width;if(w>max){size*=max/w;ctx.font=font(size);}return size;}
function marquee(text,y,size,dir,p,style,alpha){
  ctx.save();ctx.font=`${size}px Anton, Impact, sans-serif`;
  const unit=ctx.measureText(text).width;
  ctx.translate(0,y);ctx.transform(1,0,-0.18,1,0,0); // italic skew
  const off=((dir>0?p:1-p)*unit)%unit;
  ctx.globalAlpha=alpha;
  for(let x=-unit+off-unit; x<W+unit*2; x+=unit){
    if(style==='stroke'){ctx.lineWidth=1.5;ctx.strokeStyle='#f6f3f2';ctx.strokeText(text,x,0);}
    else{ctx.fillStyle=style;ctx.fillText(text,x,0);}
  }
  ctx.restore();
}

function draw(now){
  const t=((now-t0)/1000)%LOOP, p=t/LOOP;
  const beat=Math.pow(Math.max(0,Math.sin(p*TAU*2)),8);
  const portrait=H>W*1.05;

  // base gradient: black top into red floor, like the pouch
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#060606');g.addColorStop(.5,'#160405');g.addColorStop(.78,'#5a070b');g.addColorStop(1,'#c3141a');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  // product anchor
  const ph=Math.min(H*(portrait?.48:.72), W*(portrait?.9:.42)/0.761);
  const pw=ph*0.761, cx=portrait?W/2:W*.62, cy=H*(portrait?.5:.52);

  // giant marquee type behind everything
  const big=Math.min(H*.2,W*.22);
  marquee('CREATINE  ',H*.26,big,1,p,'stroke',.22);
  marquee('STRENGTH · POWER · PERFORMANCE · ',H*.26+big*.62,big*.32,-1,p,'rgba(217,22,28,.55)',1);
  marquee('100% PURE  ',H*.86,big*.9,-1,p,'rgba(0,0,0,.35)',1);

  // halftone field with rolling diagonal wave
  const step=Math.max(14,Math.min(W,H)/40);
  for(let y=step/2;y<H+step;y+=step){
    const row=Math.round(y/step), shift=(row%2)*step/2, fy=y/H;
    for(let x=-step+shift;x<W+step;x+=step){
      const base=Math.max(0,(fy-.35)/.65);
      const wave=Math.sin((x/W*1.3-fy*1.1)*TAU-p*TAU*2);
      const s=base*(.5+.5*wave)+beat*base*.3;
      const r=step*.44*Math.min(1,s); if(r<.6)continue;
      ctx.fillStyle=(fy>.78?'rgba(15,0,0,':'rgba(225,30,36,')+(.3+.5*Math.min(1,s))+')';
      ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();
    }
  }

  // shockwave rings from the product on each beat
  for(let k=0;k<2;k++){
    const q=(p*2+k*.0)%1; // one ring per beat
    const rr=ph*(.35+q*1.1);
    ctx.save();ctx.translate(cx,cy+ph*.42);ctx.scale(1,.22);
    ctx.strokeStyle=`rgba(255,80,70,${(1-q)*.55})`;ctx.lineWidth=3/(.22)*(1-q)+1;
    ctx.beginPath();ctx.arc(0,0,rr,0,TAU);ctx.stroke();ctx.restore();
    break;
  }

  // glow behind pouch
  const gl=ctx.createRadialGradient(cx,cy,0,cx,cy,ph*.85);
  gl.addColorStop(0,`rgba(255,45,40,${.55+beat*.3})`);gl.addColorStop(.5,'rgba(200,20,25,.18)');gl.addColorStop(1,'rgba(200,20,25,0)');
  ctx.fillStyle=gl;ctx.fillRect(0,0,W,H);

  // speed streaks
  ctx.save();ctx.translate(W/2,H/2);ctx.rotate(-0.18);ctx.translate(-W/2,-H/2);
  for(const s of streaks){
    const prog=(p*s.speed+s.off)%1, x=-W*.4+prog*W*1.8, len=s.len*W, y=s.y*H*1.2-H*.1;
    const lg=ctx.createLinearGradient(x-len,0,x,0);
    lg.addColorStop(0,'rgba(255,255,255,0)');lg.addColorStop(1,`rgba(255,255,255,${s.a*(.6+beat*.4)})`);
    ctx.strokeStyle=lg;ctx.lineWidth=s.w;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(x-len,y);ctx.lineTo(x,y);ctx.stroke();
  }
  ctx.restore();

  // pouch: float + slight tilt, contact shadow
  const bob=Math.sin(p*TAU)*ph*.025, tilt=Math.sin(p*TAU+1)*.03, punch=1+beat*.012;
  const shY=cy+ph*.5+ph*.06, shS=1-Math.sin(p*TAU)*.08;
  const sh=ctx.createRadialGradient(cx,shY,0,cx,shY,pw*.6*shS);
  sh.addColorStop(0,'rgba(0,0,0,.6)');sh.addColorStop(1,'rgba(0,0,0,0)');
  ctx.save();ctx.translate(cx,shY);ctx.scale(1,.16);ctx.translate(-cx,-shY);ctx.fillStyle=sh;ctx.fillRect(cx-pw,shY-pw,pw*2,pw*2);ctx.restore();
  if(img.complete&&img.naturalWidth){
    ctx.save();ctx.translate(cx,cy+bob);ctx.rotate(tilt);ctx.scale(punch,punch);
    ctx.shadowColor='rgba(255,40,40,.45)';ctx.shadowBlur=40+beat*30;
    ctx.drawImage(img,-pw/2,-ph/2,pw,ph);
    ctx.shadowBlur=0;
    // moving sheen, clipped to the pouch via an offscreen layer
    const oc=sheenCanvas(pw,ph), o=oc.getContext('2d');
    o.globalCompositeOperation='copy';o.drawImage(img,0,0,oc.width,oc.height);
    o.globalCompositeOperation='source-in';
    const sx=(-.4+p*1.8)*oc.width;
    const sg=o.createLinearGradient(sx-oc.width*.25,0,sx+oc.width*.25,oc.height);
    sg.addColorStop(0,'rgba(255,255,255,0)');sg.addColorStop(.5,'rgba(255,255,255,.18)');sg.addColorStop(1,'rgba(255,255,255,0)');
    o.fillStyle=sg;o.fillRect(0,0,oc.width,oc.height);
    ctx.drawImage(oc,-pw/2,-ph/2,pw,ph);
    ctx.restore();
  }

  // rising sparks in front
  for(const k of sparks){
    const prog=(p*k.speed+k.off)%1, y=H*(1.05-prog*1.15), x=k.x*W+Math.sin(prog*TAU+k.sway)*14, a=Math.sin(prog*Math.PI);
    ctx.fillStyle=`rgba(255,${210-prog*130|0},${200-prog*150|0},${a*.85})`;
    ctx.beginPath();ctx.arc(x,y,k.r,0,TAU);ctx.fill();
  }

  // headline block (landscape: left; portrait: top)
  ctx.save();ctx.fillStyle='#f6f3f2';ctx.textBaseline='alphabetic';
  if(!portrait){
    const lx=Math.max(24,W*.06); let s=Math.min(W*.075,H*.14); ctx.font=`${s}px Anton, Impact, sans-serif`; {const maxW=(cx-pw*.55)-lx-10, w=ctx.measureText('CREATINE').width; if(w>maxW) s*=maxW/w;}
    ctx.font=`italic 800 ${s*.22}px "Barlow Condensed", sans-serif`;ctx.fillStyle='#ff3b30';
    ctx.fillText('BUILT FOR PERFORMANCE',lx,H*.36);
    ctx.transform(1,0,-0.18,1,lx*0.18,0);ctx.fillStyle='#f6f3f2';
    ctx.font=`${s}px Anton, Impact, sans-serif`;ctx.lineWidth=2;ctx.strokeStyle='#f6f3f2';
    ctx.strokeText('100%',lx,H*.36+s*1.05);ctx.fillText('CREATINE',lx,H*.36+s*2.05);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.font=`italic 600 ${s*.2}px "Barlow Condensed", sans-serif`;ctx.fillStyle='rgba(246,243,242,.85)';
    ctx.fillText('5G PER SERVING  ·  20 SERVINGS',lx,H*.36+s*2.55);ctx.fillText('SGS LAB TESTED',lx,H*.36+s*2.8);
  }else{
    const s=Math.min(W*.13,H*.07);ctx.textAlign='center';
    ctx.font=`italic 800 ${s*.32}px "Barlow Condensed", sans-serif`;ctx.fillStyle='#ff3b30';
    ctx.fillText('BUILT FOR PERFORMANCE',W/2,H*.11);
    ctx.fillStyle='#f6f3f2';
    const hs=fitFont('100% CREATINE',z=>`${z}px Anton, Impact, sans-serif`,s,W-40);
    ctx.fillText('100% CREATINE',W/2,H*.11+hs*1.05);
    fitFont('5G PER SERVING  ·  20 SERVINGS  ·  SGS LAB TESTED',z=>`italic 600 ${z}px "Barlow Condensed", sans-serif`,s*.3,W-40);ctx.fillStyle='rgba(246,243,242,.9)';
    ctx.fillText('5G PER SERVING  ·  20 SERVINGS  ·  SGS LAB TESTED',W/2,H*.86);
  }
  ctx.restore();

  // vignette
  const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.4,W/2,H/2,Math.max(W,H)*.8);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.5)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
}
function loop(now){draw(now);if(running)requestAnimationFrame(loop);}

const playBtn=document.getElementById('playBtn');
function start(){
  if(reduce){running=false;paused=performance.now();playBtn.textContent='Play';draw(paused);}
  else requestAnimationFrame(loop);
}
Promise.all([document.fonts.load('40px Anton'),document.fonts.load('italic 800 20px "Barlow Condensed"'),document.fonts.load('italic 600 20px "Barlow Condensed"'),img.decode().catch(()=>{})]).catch(()=>{}).finally(start);

playBtn.onclick=()=>{
  if(running){running=false;paused=performance.now();playBtn.textContent='Play';}
  else{running=true;t0+=performance.now()-paused;playBtn.textContent='Pause';requestAnimationFrame(loop);}
};
const ui=document.getElementById('ui');
ui.onclick=()=>{document.querySelector('.bar').hidden=true;};
cv.addEventListener('click',()=>{document.querySelector('.bar').hidden=false;});
</script>

<script>
/* Portfolio embed hook: hide controls when framed; parent sends 'loop:play' / 'loop:pause' */
(function(){
  if (window.self === window.top) return;
  var bar = document.querySelector('.bar'); if (bar) bar.style.display = 'none';
  var btn = document.getElementById('playBtn');
  addEventListener('message', function(e){
    if (!btn || e.source !== window.parent) return;
    var playing = btn.textContent.trim() === 'Pause';
    if ((e.data === 'loop:pause' && playing) || (e.data === 'loop:play' && !playing)) btn.click();
  });
})();
</script>
