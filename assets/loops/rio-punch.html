<style>
/* Layout: full-bleed canvas carnival scene, can as hero; one small control pill bottom-right */
:root{
  --jungle:#0f5e18;
  --lime:#5fd12a;
  --sun:#ffe100;
  --teal:#2cc4b8;
  --ink:#0b0b0b;
  --cream:#fffbe6;
  --display:"Bowlby One","Arial Black",Impact,sans-serif;
  --label:"Barlow Condensed","Arial Narrow",sans-serif;
}
html,body{height:100%}
body{background:var(--jungle);color:var(--cream);overflow:hidden;font-family:var(--label)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.bar{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:5}
.bar button{font:italic 800 14px/1 var(--label);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);
  background:var(--sun);border:2.5px solid var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.bar button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.bar button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
</style>

function fitFont(text,font,size,max){ctx.font=font(size);const w=ctx.measureText(text).width;if(w>max){size*=max/w;ctx.font=font(size);}return size;}

function sunburst(cx,cy,R,p,beat){
  const n=16, rot=p*TAU/n; // advances one ray per loop, seamless
  ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);
  for(let i=0;i<n;i++){
    const a=i/n*TAU, b=a+TAU/n*.5;
    ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R,a,b);ctx.closePath();
    ctx.fillStyle=`rgba(255,225,0,${.16+beat*.08})`;ctx.fill();
  }
  ctx.restore();
}

function rhombus(cx,cy,w,h,rot,fill,stroke,lw){
  ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);
  ctx.beginPath();ctx.moveTo(0,-h/2);ctx.lineTo(w/2,0);ctx.lineTo(0,h/2);ctx.lineTo(-w/2,0);ctx.closePath();
  ctx.lineJoin='round';
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();}
  ctx.restore();
}

function frond(x,y,len,ang,sway,flip){
  ctx.save();ctx.translate(x,y);ctx.rotate(ang+sway);ctx.scale(1,flip);
  const n=13, bend=len*.25;
  const pt=t=>[len*t, bend*t*t];
  for(const side of [-1,1]){
    for(let i=1;i<n;i++){
      const t=i/n,[px,py]=pt(t), L=len*.42*Math.sin(Math.PI*(t*.9+.08)), a=side*(1.05-t*.35)+ .25;
      ctx.save();ctx.translate(px,py);ctx.rotate(a*side>0?a:a);
      ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(L*.5,-L*.13*side,L,side*L*.05);ctx.quadraticCurveTo(L*.5,L*.1*side,0,0);
      ctx.fillStyle=i%2?C.green:C.jungle;ctx.fill();ctx.lineWidth=2.2;ctx.strokeStyle=C.ink;ctx.stroke();
      ctx.restore();
    }
  }
  ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(len*.5,bend*.1,len,bend);ctx.lineWidth=4;ctx.strokeStyle=C.ink;ctx.stroke();
  ctx.lineWidth=2;ctx.strokeStyle=C.lime;ctx.stroke();
  ctx.restore();
}

function fruit(kind,x,y,r,rot){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.lineWidth=Math.max(2,r*.1);ctx.strokeStyle=C.ink;
  if(kind==='orange'||kind==='lime'){
    const rind=kind==='orange'?C.orange:'#7ed321', flesh=kind==='orange'?'#ffb23f':'#c8f06a';
    ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.fillStyle=rind;ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.arc(0,0,r*.84,0,TAU);ctx.fillStyle=C.cream;ctx.fill();

  }else{
    ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.fillStyle=C.purple;ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.arc(0,0,r*.8,0,TAU);ctx.fillStyle=C.sun;ctx.fill();
    for(let i=0;i<14;i++){const a=i*2.39996,d=r*.62*Math.sqrt((i+.5)/14);ctx.beginPath();ctx.arc(Math.cos(a)*d,Math.sin(a)*d,r*.075,0,TAU);ctx.fillStyle=C.ink;ctx.fill();}
  }
  ctx.restore();
}

function waves(p){
  const base=H*.88, layers=[{c:C.tealD,amp:.018,k:3,dir:1,dy:-.05},{c:C.teal,amp:.022,k:2,dir:-1,dy:0},{c:'#7ce8de',amp:.014,k:4,dir:1,dy:.06}];

    for(let x=0;x<=W+8;x+=8){const y=y0+Math.sin(x/W*TAU*L.k+p*TAU*L.dir)*A+Math.sin(x/W*TAU*L.k*2.3+p*TAU*L.dir*2)*A*.25;ctx.lineTo(x,y);}
    ctx.lineTo(W,H);ctx.closePath();ctx.fillStyle=L.c;ctx.fill();
    ctx.lineWidth=4;ctx.strokeStyle=C.ink;ctx.stroke();
    // crest highlight
    ctx.beginPath();
    for(let x=0;x<=W+8;x+=8){const y=y0+Math.sin(x/W*TAU*L.k+p*TAU*L.dir)*A+Math.sin(x/W*TAU*L.k*2.3+p*TAU*L.dir*2)*A*.25+7;x?ctx.lineTo(x,y):ctx.moveTo(x,y);}

function marquee(text,y,size,dir,p,mode){
  ctx.save();ctx.font=`${size}px "Bowlby One", "Arial Black", sans-serif`;
  const unit=ctx.measureText(text).width, off=((dir>0?p:1-p)*unit)%unit;
  ctx.translate(0,y);ctx.transform(1,0,-0.12,1,0,0);ctx.lineJoin='round';
  for(let x=off-unit*2;x<W+unit*2;x+=unit){
    if(mode==='outline'){ctx.lineWidth=2.5;ctx.strokeStyle='rgba(11,11,11,.35)';ctx.strokeText(text,x,0);}
    else{ctx.fillStyle=mode;ctx.fillText(text,x,0);}
  }
  ctx.restore();
}

function sticker(text,x,y,size,align,fill){
  ctx.save();ctx.font=`${size}px "Bowlby One", "Arial Black", sans-serif`;ctx.textAlign=align;ctx.lineJoin='round';

  ctx.fillStyle=fill;ctx.fillText(text,0,0);
  ctx.restore();

function pill(text,x,y,size,align){

  const big=Math.min(H*.17,W*.17);
  marquee('RIO PUNCH • ',H*.2,big,1,p,'outline');
  marquee('ENERGY + JUICE • ',H*.2+big*.55,big*.3,-1,p,'rgba(11,69,18,.45)');
  marquee('RIO PUNCH • ',H*.74,big,-1,p,'outline');

  // flag diamond behind can, with beat echo
  const rw=ch*(portrait?1.25:1.15), rh=rw*.62, rrot=Math.sin(p*TAU)*.04;
  const echo=bp; rhombus(cx,cy,rw*(1+echo*.55),rh*(1+echo*.55),rrot,null,`rgba(255,225,0,${(1-echo)*.8})`,6*(1-echo)+1);
  rhombus(cx+10,cy+12,rw*(1+beat*.04),rh*(1+beat*.04),rrot,C.ink);
  rhombus(cx,cy,rw*(1+beat*.04),rh*(1+beat*.04),rrot,C.sun,C.ink,6);
  // dotted inner stitch
  ctx.save();ctx.setLineDash([2,12]);ctx.lineCap='round';rhombus(cx,cy,rw*.86*(1+beat*.04),rh*.86*(1+beat*.04),rrot,null,'rgba(11,11,11,.55)',4);ctx.restore();

  // palm fronds framing corners
  const fl=Math.max(W,H)*(portrait?.42:.3);
  frond(-fl*.05,-fl*.05,fl,.55,Math.sin(p*TAU)*.06,1);
  frond(W+fl*.05,-fl*.05,fl,Math.PI-.55,-Math.sin(p*TAU+1)*.06,-1);
  frond(-fl*.1,H*.82,fl*.75,-.5,Math.sin(p*TAU*2+2)*.05,-1);
  frond(W+fl*.1,H*.8,fl*.75,Math.PI+.5,-Math.sin(p*TAU*2)*.05,1);

  waves(p);

  // juice splash burst each beat
  for(const d of drops){
    const a=d.a+beatIdx*.37, dist=ch*(.18+bp*d.v*.7), s=cw*.07*d.s*(1-bp*.7);
    const x=cx+Math.cos(a)*dist*1.15, y=cy+Math.sin(a)*dist*.8+bp*bp*ch*.12;
    if(bp>.85)continue;
    ctx.save();ctx.translate(x,y);ctx.rotate(a+Math.PI/2);
    ctx.beginPath();ctx.moveTo(0,-s*1.6);ctx.quadraticCurveTo(s,0,0,s);ctx.quadraticCurveTo(-s,0,0,-s*1.6);
    ctx.fillStyle=d.c;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=C.ink;ctx.stroke();ctx.restore();
  }

  // orbiting fruit (behind half)
  const drawFruits=front=>{for(const f of fruits){
    const a=f.ang+p*TAU, z=Math.sin(a);
    if((z>0)!==front)continue;
    const R=ch*f.rad, x=cx+Math.cos(a)*R*(portrait?.95:1.05), y=cy+z*R*.22+Math.sin(p*TAU*2+f.dy)*ch*.03-ch*.05;
    const sc=.75+.25*(z+1)/2;
    fruit(f.kind,x,y,cw*.22*f.size*sc,p*TAU*f.spin);
  }};
  drawFruits(false);

  // contact shadow
  const bob=Math.sin(p*TAU*2)*ch*.018, tilt=Math.sin(p*TAU)*.05, punch=1+beat*.025;
  ctx.save();ctx.translate(cx,cy+ch*.53);ctx.scale(1,.18);
  const sh=ctx.createRadialGradient(0,0,0,0,0,cw*.8);sh.addColorStop(0,'rgba(5,40,10,.55)');sh.addColorStop(1,'rgba(5,40,10,0)');
  ctx.fillStyle=sh;ctx.fillRect(-cw,-cw,cw*2,cw*2);ctx.restore();

  // can with outline sticker edge + sheen
  if(img.complete&&img.naturalWidth){
    const oc=layer(cw,ch),o=oc.getContext('2d');
    o.globalCompositeOperation='copy';o.drawImage(img,0,0,oc.width,oc.height);
    o.globalCompositeOperation='source-atop';
    const sx=(-.6+((p*2)%1)*2.2)*oc.width;
    const sg=o.createLinearGradient(sx-oc.width*.3,0,sx+oc.width*.3,oc.height*.25);
    sg.addColorStop(0,'rgba(255,255,255,0)');sg.addColorStop(.5,'rgba(255,255,255,.28)');sg.addColorStop(1,'rgba(255,255,255,0)');
    o.fillStyle=sg;o.fillRect(0,0,oc.width,oc.height);
    ctx.save();ctx.translate(cx,cy+bob);ctx.rotate(tilt);ctx.scale(punch,punch);
    // thick ink outline: draw silhouette offsets
    ctx.filter='brightness(0)';
    for(let i=0;i<12;i++){const a=i/12*TAU;ctx.drawImage(img,-cw/2+Math.cos(a)*5,-ch/2+Math.sin(a)*5,cw,ch);}
    ctx.filter='none';
    ctx.drawImage(oc,-cw/2,-ch/2,cw,ch);
    ctx.restore();
  }

  drawFruits(true);

  // confetti
  for(const k of confetti){
    const prog=(p*k.sp+k.off)%1, y=-H*.08+prog*H*1.15, x=k.x*W+Math.sin(prog*TAU*2+k.sway)*24;
    ctx.save();ctx.translate(x,y);ctx.rotate(p*TAU*k.spin+k.sway);ctx.scale(1,Math.cos(p*TAU*k.spin*2));
    ctx.fillStyle=k.c;ctx.fillRect(-k.w/2,-k.h/2,k.w,k.h);ctx.restore();
  }

  // headline
  if(!portrait){
    const lx=Math.max(28,W*.06), maxW=(cx-rw*.5)-lx;
    let s=fitFont('PUNCH',z=>`${z}px "Bowlby One", sans-serif`,Math.min(H*.16,W*.1),maxW*.95);
    const y0=H*.42+beat*0; 
    sticker('RIO',lx,y0,s,'left',C.sun);
    sticker('PUNCH',lx,y0+s*1.05,s,'left',C.cream);
    pill('ENERGY + JUICE',lx,y0+s*1.45,Math.max(14,s*.24),'left');
  }else{
    const s=fitFont('RIO PUNCH',z=>`${z}px "Bowlby One", sans-serif`,Math.min(W*.15,H*.075),W-56);
    sticker('RIO PUNCH',W/2,H*.15,s,'center',C.sun);
    pill('ENERGY + JUICE',W/2,H*.15+s*.45,Math.max(14,s*.3),'center');
  }

  // grain + edge vignette
  if(!grainPat)grainPat=ctx.createPattern(grain,'repeat');
  ctx.save();ctx.globalAlpha=.06;ctx.globalCompositeOperation='overlay';ctx.fillStyle=grainPat;ctx.fillRect(0,0,W,H);ctx.restore();
  const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.45,W/2,H/2,Math.max(W,H)*.85);
  vg.addColorStop(0,'rgba(0,30,5,0)');vg.addColorStop(1,'rgba(0,30,5,.45)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
}
function loop(now){draw(now);if(running)requestAnimationFrame(loop);}

const playBtn=document.getElementById('playBtn');
function start(){if(reduce){running=false;paused=performance.now();playBtn.textContent='Play';draw(paused);}else requestAnimationFrame(loop);}
Promise.all([document.fonts.load('40px "Bowlby One"'),document.fonts.load('italic 800 20px "Barlow Condensed"'),img.decode().catch(()=>{})]).catch(()=>{}).finally(start);
playBtn.onclick=()=>{if(running){running=false;paused=performance.now();playBtn.textContent='Play';}else{running=true;t0+=performance.now()-paused;playBtn.textContent='Pause';requestAnimationFrame(loop);}};
document.getElementById('ui').onclick=e=>{e.stopPropagation();document.querySelector('.bar').hidden=true;};
cv.addEventListener('click',()=>{document.querySelector('.bar').hidden=false;});
</script>

<script>
/* Portfolio embed hook: hide controls when framed; parent sends 'loop:play' / 'loop:pause' */
(function(){
  if (window.self === window.top) return;
  var bar = document.querySelector('.bar'); if (bar) bar.style.display = 'none';
  var btn = document.getElementById('playBtn');
  addEventListener('message', function(e){
    if (!btn || e.source !== window.parent) return;
    var playing = btn.textContent.trim() === 'Pause';
    if ((e.data === 'loop:pause' && playing) || (e.data === 'loop:play' && !playing)) btn.click();
  });
})();
</script>
